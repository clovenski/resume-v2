<svg xmlns="http://www.w3.org/2000/svg" width="680" height="744" viewBox="0 0 680 744" role="img">
<title>VTuber Schedules search pipeline</title>
<desc>A Lambda updates the Streams DynamoDB table. Item changes flow through a stream to a collector Lambda that filters no-op changes, stages deltas in SearchSync (DynamoDB), and queues a delayed message. A rebuilder Lambda merges changes into a gzipped JSON file in S3 using a hash check and conditional write. Failed messages go to a dead-letter queue. CloudFront serves the file to the Angular app, which searches in the browser with MiniSearch.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;font-weight:400}
.lbl{font-size:14px;font-weight:600;text-anchor:start;fill:#2C2C2A}
.leg{font-size:12px;text-anchor:start;fill:#5F5E5A}
.pb{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.pt{fill:#3C3489}
.ps{fill:#534AB7}
.tb{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.tt{fill:#085041}
.tsb{fill:#0F6E56}
.gb{fill:#F1EFE8;stroke:#888780;stroke-width:.5}
.gt{fill:#2C2C2A}
.gs{fill:#5F5E5A}
.dash{stroke-dasharray:4 3}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:.75;stroke-dasharray:3 3;fill:none}
.cont{fill:none;stroke:#B4B2A9;stroke-width:.75;stroke-dasharray:4 4}
</style>
</defs>

