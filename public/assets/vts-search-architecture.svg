<line class="arr" x1="379" y1="398" x2="355" y2="398" marker-end="url(#arrow)"/>

<rect class="cont" x="14" y="470" width="662" height="222" rx="12"/>
<text class="lbl" x="30" y="492">Read path (client-side search)</text>

<rect class="tb" x="228" y="510" width="125" height="56" rx="8"/>
<text class="th tt" x="290" y="529">CloudFront</text>
<text class="ts tsb" x="290" y="548">Edge cache + OAC</text>

<rect class="gb" x="381" y="510" width="125" height="56" rx="8"/>
<text class="th gt" x="443" y="529">Angular app</text>
